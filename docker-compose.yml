services:
  # ── MySQL Database ──────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: mms_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-mms_root_2024}
      MYSQL_DATABASE: ${DB_NAME:-nnak_system}
      MYSQL_USER: ${DB_USER:-mms_user}
      MYSQL_PASSWORD: ${DB_PASS:-mms_root_2024}
    volumes:
      - mms_db_data:/var/lib/mysql
      - ./backend/MASTER_SCHEMA.sql:/docker-entrypoint-initdb.d/00_master_schema.sql:ro
      - ./backend/migrations:/migrations:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-mms_root_2024}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mms_network

  # ── PHP Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mms_backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-nnak_system}
      DB_USER: ${DB_USER:-mms_user}
      DB_PASS: ${DB_PASS:-mms_root_2024}
      APP_URL: ${APP_URL:-http://localhost}
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      JWT_SECRET: ${JWT_SECRET:-change_in_production_mms_2024}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-7200}
    volumes:
      - ./backend:/var/www/html/backend
      - mms_uploads:/var/www/html/backend/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mms_network
    expose:
      - "9000"

  # ── React Frontend (Nginx) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mms_frontend
    restart: unless-stopped
    networks:
      - mms_network
    expose:
      - "80"

  # ── Nginx Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mms_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - mms_uploads:/var/www/html/backend/uploads:ro
    depends_on:
      - backend
      - frontend
    networks:
      - mms_network

# ── Volumes ──────────────────────────────────────────────────────
volumes:
  mms_db_data:
    driver: local
  mms_uploads:
    driver: local

# ── Networks ─────────────────────────────────────────────────────
networks:
  mms_network:
    driver: bridge
